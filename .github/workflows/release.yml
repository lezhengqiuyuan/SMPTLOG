name: Build & Release

# 触发方式：
#   1. 推送 v* 标签（如 v1.0.0）→ 自动构建三端产物并创建 GitHub Release
#   2. 手动在 Actions 页面点 Run workflow → 只构建并上传 artifact，不发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # SignPath 签名动作需要读取本次运行的 artifact

env:
  PROJECT_DIR: SRC/smptlog
  APP_VERSION: 1.1.0

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: 静态检查与单元测试
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze --no-fatal-warnings
          flutter test

      - name: 构建 Windows Release
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build windows --release

      # 安装包由仓库内的 C# 源码编译而来（不使用自解压外壳），
      # 保证「二进制来自本仓库的源码」，符合代码签名政策的要求。
      - name: 编译安装包与卸载程序
        working-directory: ${{ env.PROJECT_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $work = Join-Path $env:RUNNER_TEMP 'pkg'
          New-Item -ItemType Directory -Path $work -Force | Out-Null

          # 1) 程序文件打包
          & "$env:SystemRoot\System32\tar.exe" -a -c -f "$work\app.zip" `
              -C 'build\windows\x64\runner\Release' .
          if ($LASTEXITCODE -ne 0) { throw 'tar 打包失败' }

          # 2) 卸载程序
          & $csc /nologo /target:winexe /out:"$work\uninstall.exe" `
              /r:System.Windows.Forms.dll /r:System.Drawing.dll `
              'installer\src\Uninstaller.cs' 'installer\src\AssemblyInfo.cs'
          if ($LASTEXITCODE -ne 0) { throw 'Uninstaller 编译失败' }

          # 3) 单文件安装包（程序与卸载器作为内嵌资源）
          New-Item -ItemType Directory -Path '..\..\EXE' -Force | Out-Null
          $out = "..\..\EXE\SMPTLOG-Setup-$env:APP_VERSION.exe"
          & $csc /nologo /target:winexe /out:$out `
              "/resource:$work\app.zip,app.zip" `
              "/resource:$work\uninstall.exe,uninstall.exe" `
              /r:System.Windows.Forms.dll /r:System.Drawing.dll `
              /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll `
              'installer\src\Installer.cs' 'installer\src\AssemblyInfo.cs'
          if ($LASTEXITCODE -ne 0) { throw 'Installer 编译失败' }

          Get-Item $out | Format-List Name, Length

      # ---------------------------------------------- SignPath 代码签名（可选）
      # 申请通过后在仓库 Settings → Secrets and variables → Actions 里配置：
      #   Secret  SIGNPATH_API_TOKEN     SignPath API 令牌（具备提交者权限）
      #   Var     SIGNPATH_ORG_ID        SignPath 组织 ID
      #   Var     SIGNPATH_PROJECT_SLUG  SignPath 项目短名
      #   Var     SIGNPATH_POLICY_SLUG   签名策略短名
      # 未设置 SIGNPATH_PROJECT_SLUG 时下面三步全部跳过，产物保持未签名。
      - name: 上传未签名安装包（供 SignPath 读取）
        id: upload-unsigned
        if: "startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_PROJECT_SLUG != ''"
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: EXE/SMPTLOG-Setup-*.exe
          if-no-files-found: error

      - name: 提交签名请求（SignPath Foundation）
        if: "startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_PROJECT_SLUG != ''"
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # 每次签名都要 Approver 在 SignPath 网页端手动批准，留足 1 小时
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: 用已签名安装包覆盖未签名产物
        if: "startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_PROJECT_SLUG != ''"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = Get-ChildItem -Path signed -Recurse -Filter '*.exe' | Select-Object -First 1
          if (-not $signed) { throw 'SignPath 未返回已签名文件' }
          Copy-Item $signed.FullName 'EXE' -Force
          Get-Item (Join-Path 'EXE' $signed.Name) | Format-List Name, Length

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: EXE/SMPTLOG-Setup-*.exe
          if-no-files-found: error

  # ----------------------------------------------------------------- Android
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # 正式签名：仓库 Secrets 里配置好才会使用，
      # 否则回退 debug 签名（两个版本的签名不同，无法覆盖升级，仅供测试）。
      - name: 配置 Android 签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次使用 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > SRC/smptlog/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          EOF
          echo "已配置正式签名：$KEY_ALIAS"
      - name: 构建 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --tree-shake-icons

      - name: 整理产物
        run: |
          mkdir -p APK
          cp SRC/smptlog/build/app/outputs/flutter-apk/app-release.apk \
             "APK/SMPTLOG-v${APP_VERSION}.apk"
          ls -lh APK

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: APK/SMPTLOG-*.apk
          if-no-files-found: error

  # ----------------------------------------------------------------- Release
  release:
    name: 发布 Release
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: SMPTLOG ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/windows-installer/*.exe
            dist/android-apk/*.apk
          body: |
            ## SMPTLOG 通联日志 ${{ github.ref_name }}

            业余无线电通联日志助手 · Android + Windows 双端 · 本地优先

            ### 下载
            | 平台 | 文件 | 说明 |
            |---|---|---|
            | Windows 10/11 (x64) | `SMPTLOG-Setup-*.exe` | 双击安装，免管理员权限 |
            | Android 8.0+ | `SMPTLOG-v*.apk` | 需允许「安装未知来源应用」 |

            ### 说明
            - 数据默认只存本地，云同步为可选功能
            - 详细说明见 [README](https://github.com/${{ github.repository }}#readme)

            ### Code signing policy（代码签名政策）
            Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).
            Windows 安装包使用 SignPath Foundation 提供的证书签名（申请通过后生效），签名范围与验证方法见 [CODE_SIGNING.md](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING.md)。

            > 本产物由 GitHub Actions 从本仓库源码自动构建。
